<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Catalog Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        h1 { margin-bottom: 30px; color: #f8fafc; }
        form { background: #1e293b; padding: 20px; border-radius: 10px; display: inline-block; margin-bottom: 40px; }
        input[type="file"] { color: #cbd5e1; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: #1e293b; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card p { padding: 15px; margin: 0; font-size: 14px; font-weight: 600; color: #e2e8f0; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Generated Pro Catalog Results (6 Views)</h1>
        
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <br><br>
            <button type="submit">Generate Catalog</button>
        </form>

        {% if views %}
        <div class="grid">
            {% for view in views %}
            <div class="card">
                <!-- Fallback to uploaded image if sample images are missing -->
                <img src="{{ view.url }}" alt="{{ view.title }}" onerror="this.src='{{ uploaded_image }}'">
                <p>{{ view.title }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
