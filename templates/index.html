<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Clothing Catalog Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #07090e;
            --bg-card: #0d1322;
            --border-color: #1e293b;
            --accent-purple: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; background: linear-gradient(to right, #ffffff, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); font-size: 1rem; }
        .main-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; width: 100%; max-width: 1000px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card h2 { font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: #e2e8f0; }
        .upload-box { border: 2px dashed var(--border-color); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.01); }
        .upload-box:hover { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.03); }
        .views-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .view-btn { background: #111827; border: 1px solid var(--border-color); color: var(--text-muted); padding: 15px; border-radius: 10px; cursor: pointer; text-align: left; font-weight: 500; transition: 0.2s; }
        .view-btn.active { border-color: var(--accent-purple); color: var(--text-main); background: rgba(139, 92, 246, 0.1); }
        textarea { width: 100%; background: #111827; border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; color: var(--text-main); resize: none; height: 90px; margin-bottom: 20px; outline: none; }
        textarea:focus { border-color: var(--accent-purple); }
        .generate-btn { width: 100%; background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 20px var(--accent-glow); transition: 0.3s; }
        .generate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>
    <header>
        <h1>One Clothing Photo. Multiple Product Views.</h1>
        <p>Create professional e-commerce photography from a single clothing image.</p>
    </header>

    <div class="main-container">
        <div class="card">
            <h2>📤 Upload Your Clothing Photo</h2>
            <div class="upload-box">
                <p>Drag & Drop or Click to Upload</p>
                <p style="font-size: 0.8rem; margin-top: 8px;">JPG, PNG or WEBP</p>
            </div>
        </div>

        <div class="card">
            <h2>🎛️ Select Product Views</h2>
            <div class="views-grid">
                <button class="view-btn active">👤 Front View</button>
                <button class="view-btn active">🧍 Back View</button>
                <button class="view-btn active">🚶 Side View</button>
                <button class="view-btn active">🔍 Close Front</button>
            </div>
            <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 8px;">Custom Prompt Details (Optional)</label>
            <textarea placeholder="e.g. Professional studio lighting, neutral grey background..."></textarea>
            <button class="generate-btn">✨ Generate Product Views</button>
        </div>
    </div>
</body>
</html>
