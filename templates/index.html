<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Multi-Shirt Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; text-align: center; }
        h1 { margin-bottom: 20px; color: #f8fafc; }
        .selector-box { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 30px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        select { padding: 8px 15px; border-radius: 5px; background: #0f172a; color: #fff; border: 1px solid #334155; font-size: 14px; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-left: 10px; }
        button:hover { background: #2563eb; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); padding-bottom: 15px; }
        .card img { width: 100%; height: 250px; object-fit: cover; background: #fff; }
        .card p { padding: 10px 15px; margin: 0; font-size: 14px; font-weight: 600; color: #e2e8f0; }
        .download-btn { display: inline-block; background: #10b981; color: white; padding: 6px 15px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; margin-top: 5px; }
        .download-btn:hover { background: #059669; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Professional Multi-Shirt Catalog Generator</h1>

        <!-- Shirt Selection Dropdown -->
        <div class="selector-box">
            <form method="POST">
                <label for="shirt_choice" style="margin-right: 10px; font-weight: bold;">Select Shirt Line:</label>
                <select name="shirt_choice" id="shirt_choice">
                    <option value="blue_stripe" {% if current_shirt == 'blue_stripe' %}selected{% endif %}>Classic Blue Stripe Shirt</option>
                    <option value="checked_shirt" {% if current_shirt == 'checked_shirt' %}selected{% endif %}>Checkered Plaid Shirt</option>
                </select>
                <button type="submit">Load Catalog</button>
            </form>
        </div>

        {% if views %}
        <div class="grid">
            {% for view in views %}
            <div class="card">
                <img src="{{ view.url }}" alt="{{ view.title }}">
                <p>{{ view.title }}</p>
                <a href="{{ view.url }}" class="download-btn" download>Download View</a>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
